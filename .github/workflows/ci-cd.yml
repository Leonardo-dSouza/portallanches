# CI do PortalLanches (plano e decisões: docs/servidor-producao.md, seção "Deploy pelo GitHub").
# Todo push testa. Na main também monta as imagens no GHCR, que o deploy manual baixa no note.
# O job de deploy pelo runner do note saiu em 2026-10-11, a pedido do usuário: o runner nunca foi
# instalado e cada push deixava um run parado em "Waiting". Para voltar, ver o histórico deste arquivo.
# As Actions vão por SHA do commit (o comentário diz a versão): uma tag pode ser movida pelo dono da
# Action, um SHA não (S-15 do mapa de segurança, 2026-11-15).
name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  # O GHCR exige minúsculas; o dono do repositório é "Leonardo-dSouza".
  IMAGE_PREFIX: ghcr.io/leonardo-dsouza/portallanches

jobs:
  test:
    name: test (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      # src/generated não vai para o git; o prisma.config.ts tem URL padrão, então não precisa de banco.
      - if: matrix.app == 'backend'
        run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  scripts:
    name: scripts de deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x deploy/*.sh deploy/lib/*.sh deploy/tests/*.sh
      - run: deploy/tests/prod-common.test.sh
      # Sobe o nginx da imagem web com a config do repositório e confere cabeçalhos e limites.
      - run: deploy/tests/web-headers.test.sh

  images:
    name: imagem ${{ matrix.image }}
    needs: [test, scripts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: migrate
            context: backend
            target: migrate
          - image: backend
            context: backend
            target: runtime
          - image: web
            context: frontend
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
          # Liga o pacote do GHCR a este repositório.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
