# Atualizações de dependências (S-15 do mapa de segurança, 2026-11-15). Os alertas de vulnerabilidade
# e as correções de segurança automáticas estão ligados nas configurações do repositório; este arquivo
# cuida das atualizações de rotina. Menor e patch vêm num PR só por pasta, para não encher de PRs;
# cada PR roda o CI (pull_request). Nada vai para a produção sem o deploy manual.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      backend-menores:
        update-types: [minor, patch]
    # oxlint acima do 1.83 cai com "Illegal instruction" no PC de dev (CPU sem AVX2), 2026-11-25.
    # Os tipos do Node acompanham o Node das imagens (node:24): major novo só junto com o Dockerfile.
    ignore:
      - dependency-name: oxlint
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-menores:
        update-types: [minor, patch]
    # oxlint acima do 1.83 cai com "Illegal instruction" no PC de dev (CPU sem AVX2), 2026-11-25.
    # Os tipos do Node acompanham o Node das imagens (node:24): major novo só junto com o Dockerfile.
    ignore:
      - dependency-name: oxlint
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # As Actions vão por SHA (ci-cd.yml): o Dependabot troca o SHA e o comentário da versão.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
