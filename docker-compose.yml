# Postgres local para desenvolvimento, em 15433 (porta pouco usada; 5432 costuma ter um Postgres nativo); a DATABASE_URL de backend/.env.example aponta para ele.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portallanches
    ports:
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
