# Cabeçalhos de defesa em toda resposta (S-13 do mapa de segurança, 2026-11-15). Fica num arquivo à
# parte porque o nginx só herda `add_header` do bloco de cima quando o bloco não tem nenhum: cada
# `location` com `add_header` próprio inclui este arquivo de novo.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
# O app só carrega o que é dele (fontes do fontsource, sem CDN, sem eval). `unsafe-inline` só no
# estilo, pelos `style=` do React; a comanda impressa usa imagem `data:`.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
