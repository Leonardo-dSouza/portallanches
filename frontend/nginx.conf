server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # O front chama /api/*; o backend não tem prefixo (o Vite faz o mesmo em desenvolvimento).
    location /api/ {
        # A importação de planilhas manda o arquivo em base64 (até 5 MB → ~6,7 MB); o padrão é 1 MB.
        client_max_body_size 8m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Rotas do React (/caixa, /historico...) caem no index.html; ele nunca fica em cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
