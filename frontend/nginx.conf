server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # O front chama /api/*; o backend não tem prefixo (o Vite faz o mesmo em desenvolvimento).
    location /api/ {
        # O maior corpo é o HTML salvo da nota (3 rotas de gasto); o backend segura o resto em 100 KB.
        # Eram 8 MB por causa da importação de planilha, que saiu em 2026-11-10 (S-12 do mapa de segurança).
        client_max_body_size 3m;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # Só o IP que o nginx viu: somar o X-Forwarded-For do cliente deixava ele escrever o próprio IP.
        # O limitador de senhas do backend trava por aparelho com esse IP (trust proxy 1 no main).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Rotas do React (/caixa, /historico...) caem no index.html; ele nunca fica em cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
