# Ritmo do login por IP (S-06 do mapa de segurança): o backend já trava por aparelho; aqui a rajada
# para antes de chegar nele. 10 por minuto com folga de 10 cobre o caixa errando a senha.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # Sem a versão do nginx nas respostas e nas páginas de erro.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Caixa ao vivo (2026-11-24): o stream SSE fica aberto. Sem buffer, o aviso chega na hora; o timeout de
    # leitura de 1 h não corta a conexão parada (o backend manda um ping a cada 25 s).
    location = /api/live/events {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # O front chama /api/*; o backend não tem prefixo (o Vite faz o mesmo em desenvolvimento).
    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # Arquivos com hash no nome nunca mudam: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Rotas do React (/caixa, /historico...) caem no index.html; ele nunca fica em cache.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
